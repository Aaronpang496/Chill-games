<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg, linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%));
    padding: 14px;
    min-height: 100vh;
    overflow: hidden;
    color: #e0e7ff;
    position: relative;
  }
  /* Animated aurora */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(120,80,255,0.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,200,255,0.12), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255,0,150,0.08), transparent 50%);
    animation: aurora 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes aurora {
    0% { transform: scale(1) rotate(0deg); opacity: 0.8; }
    100% { transform: scale(1.3) rotate(15deg); opacity: 1; }
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding: 0 6px;
    color: #c7d2fe;
    text-shadow: 0 0 20px rgba(147,197,253,0.5);
  }
  .stat { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
  .stat span { color: #67e8f9; text-shadow: 0 0 10px rgba(103,232,249,0.8); }
  .streak-big {
    background: linear-gradient(90deg, #ff6b35, #f7b32b, #ff6b35);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-size: 24px; font-weight: 800;
    animation: shine 2s linear infinite;
  }
  @keyframes shine {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  .combo-badge {
    position: fixed; top: 12px; right: 12px;
    background: linear-gradient(135deg, #ff1744, #d500f9);
    color: white; font-weight: 900; font-size: 22px;
    padding: 8px 20px; border-radius: 30px;
    box-shadow: 0 0 30px rgba(213,0,249,0.7), 0 0 15px rgba(255,23,68,0.5);
    opacity: 0; transform: scale(0.5);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    z-index: 9999;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
  }
  .combo-badge.active { opacity: 1; transform: scale(1); }
  .combo-badge.pulse { animation: comboPulse 0.3s ease-out; }
  @keyframes comboPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 10), 1fr);
    gap: 4px;
    background: rgba(15, 12, 41, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 12px;
    border-radius: 18px;
    border: 1px solid rgba(147, 197, 253, 0.15);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.4),
      inset 0 0 60px rgba(99, 102, 241, 0.08),
      0 0 80px rgba(99, 102, 241, 0.2);
    position: relative;
  }
  .cell {
    aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; background: transparent; padding: 0;
    position: relative;
  }
  .bubble-svg {
    width: 100%; height: 100%;
    transition: transform 0.15s ease-out, filter 0.15s ease-out;
    filter: drop-shadow(0 0 6px rgba(103,232,249,0.4));
    position: absolute; top: 0; left: 0;
  }
  .cell:hover:not(.popped) .bubble-svg {
    transform: scale(1.15);
    filter: drop-shadow(0 0 16px rgba(103,232,249,0.9)) drop-shadow(0 0 6px white);
  }
  .cell.popping .bubble-svg { animation: popAnim 0.35s ease-out forwards; }
  @keyframes popAnim {
    0%   { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 10px white); }
    40%  { transform: scale(1.6) rotate(12deg); opacity: 0.9; filter: drop-shadow(0 0 30px white); }
    100% { transform: scale(0) rotate(-20deg); opacity: 0; }
  }
  .cell.popped { cursor: default; opacity: 0.15; }
  .cell.popped .bubble-svg {
    transform: scale(0.55);
    filter: grayscale(1) drop-shadow(0 0 1px rgba(0,0,0,0.3));
  }
  .cell.popped:hover .bubble-svg { transform: scale(0.55); }
  .power-glow {
    position: absolute; inset: 4%;
    border-radius: 50%;
    animation: powerGlow 1s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes powerGlow {
    from { box-shadow: 0 0 10px 3px var(--glow, gold); }
    to   { box-shadow: 0 0 28px 8px var(--glow, gold); }
  }
  .finish-banner {
    margin-top: 16px; padding: 20px; border-radius: 16px;
    background: linear-gradient(135deg, rgba(102,187,106,0.9), rgba(67,160,71,0.9));
    backdrop-filter: blur(10px);
    color: white; text-align: center; font-weight: 700; font-size: 20px;
    box-shadow: 0 0 40px rgba(102,187,106,0.6);
    animation: slideIn 0.45s ease-out;
  }
  @keyframes slideIn {
    from { transform: translateY(-20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .btn {
    display: block; margin: 14px auto 0;
    padding: 12px 28px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    box-shadow: 0 4px 20px rgba(102,126,234,0.5);
    transition: all 0.15s;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(102,126,234,0.8);
  }
  .btn:active { transform: translateY(0); }
  .streak-fire {
    display: inline-block;
    animation: firePulse 0.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 8px orange);
  }
  @keyframes firePulse {
    from { transform: scale(1); }
    to   { transform: scale(1.2); }
  }
  .float-score {
    position: absolute; font-weight: 900; font-size: 22px;
    color: #67e8f9; pointer-events: none;
    animation: floatUp 0.95s ease-out forwards;
    text-shadow: 0 0 12px rgba(103,232,249,0.9), 0 0 4px white;
    z-index: 9999;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    20%  { opacity: 1; transform: translateY(-8px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-60px) scale(1); }
  }
  .sparkle {
    position: absolute; font-size: 16px;
    pointer-events: none; z-index: 9998;
    animation: sparkleOut 0.8s ease-out forwards;
    filter: drop-shadow(0 0 6px currentColor);
  }
  @keyframes sparkleOut {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="stat">✨ Total: <span id="total">0</span></div>
    <div class="stat streak-big">
      <span id="streak-icon">🔥</span> <span id="streak">0</span>
    </div>
    <div class="stat">⭐ Best: <span id="best">0</span></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="finish-container"></div>
  <div class="combo-badge" id="comboBadge">x1</div>

  <audio id="popSound" preload="auto"></audio>
  <audio id="streakSound" preload="auto"></audio>
  <audio id="finishSound" preload="auto"></audio>
  <audio id="powerSound" preload="auto"></audio>

<script>
let state = [];
let streak = 0;
let sessionPops = 0;
let totalPops = 0;
let bestStreak = 0;
let finished = false;
let combo = 1;
let comboCount = 0;
let comboTimeout = null;
let cells = [];
let theme = "ocean";
let powerUps = {};

const THEMES = {
  ocean: {
    bg: "linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)",
    hueBase: 190, hueRange: 40,
  },
  pastel: {
    bg: "linear-gradient(135deg,#2d1b3d 0%,#4a1d47 50%,#1f0e2e 100%)",
    hueBase: 300, hueRange: 60,
  },
  sunset: {
    bg: "linear-gradient(135deg,#1a0b2e 0%,#3d1a2e 50%,#4a1a1a 100%)",
    hueBase: 20, hueRange: 40,
  },
  holiday: {
    bg: "linear-gradient(135deg,#0b2818 0%,#1a3d2e 50%,#0f1f1a 100%)",
    hueBase: 120, hueRange: 60,
  },
};

function onRender(event) {
  const data = event.data || {};
  const args = data.args || {};
  if (args.state) state = args.state;
  if (args.best_streak !== undefined) bestStreak = args.best_streak;
  if (args.total_pops !== undefined) totalPops = args.total_pops;
  if (args.theme && THEMES[args.theme]) {
    theme = args.theme;
    document.body.style.setProperty("--bg", THEMES[theme].bg);
  }
  if (args.power_ups) powerUps = args.power_ups;
  renderGrid();
  updateHUD();
}

function makeBubbleSVG(idx, isGold, isRainbow) {
  const t = THEMES[theme];
  const seed = (idx * 9301 + 49297) % 233280;
  const rnd = seed / 233280;
  const hue = t.hueBase + rnd * t.hueRange;
  const hx = 12 + rnd * 6;
  const hy = 12 + rnd * 6;

  if (isRainbow) {
    return `
    <svg viewBox="0 0 40 40" class="bubble-svg">
      <defs>
        <linearGradient id="rb${idx}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff1744"/>
          <stop offset="25%" stop-color="#ffea00"/>
          <stop offset="50%" stop-color="#00e676"/>
          <stop offset="75%" stop-color="#00b0ff"/>
          <stop offset="100%" stop-color="#d500f9"/>
        </linearGradient>
        <radialGradient id="rbshine${idx}" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="rgba(255,255,255,1)"/>
          <stop offset="60%" stop-color="rgba(255,255,255,0.15)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
      </defs>
      <circle cx="20" cy="20" r="17" fill="url(#rb${idx})" stroke="#fff" stroke-width="1.8"/>
      <circle cx="20" cy="20" r="17" fill="url(#rbshine${idx})"/>
      <ellipse cx="${hx}" cy="${hy}" rx="4" ry="5" fill="white" opacity="0.9"/>
    </svg>`;
  }
  if (isGold) {
    return `
    <svg viewBox="0 0 40 40" class="bubble-svg">
      <defs>
        <radialGradient id="gd${idx}" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fff9c4"/>
          <stop offset="45%" stop-color="#ffd54f"/>
          <stop offset="100%" stop-color="#ff8f00"/>
        </radialGradient>
      </defs>
      <circle cx="20" cy="20" r="17" fill="url(#gd${idx})"
              stroke="#fff8e1" stroke-width="1.6"/>
      <ellipse cx="${hx}" cy="${hy}" rx="4" ry="5" fill="white" opacity="0.95"/>
      <text x="20" y="26" text-anchor="middle" font-size="14" font-weight="900"
            fill="#bf6c00" opacity="0.8">★</text>
    </svg>`;
  }
  return `
  <svg viewBox="0 0 40 40" class="bubble-svg">
    <defs>
      <radialGradient id="bg${idx}" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
        <stop offset="40%" stop-color="hsl(${hue},80%,75%,0.55)"/>
        <stop offset="100%" stop-color="hsl(${hue},90%,45%,0.85)"/>
      </radialGradient>
    </defs>
    <circle cx="20" cy="20" r="17" fill="url(#bg${idx})"
            stroke="hsl(${hue},90%,70%)" stroke-width="1.2"/>
    <ellipse cx="${hx}" cy="${hy}" rx="4" ry="5" fill="white" opacity="0.9"/>
    <circle cx="28" cy="27" r="1.8" fill="white" opacity="0.7"/>
    <circle cx="15" cy="30" r="1" fill="white" opacity="0.5"/>
  </svg>`;
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  cells = [];
  for (let i = 0; i < state.length; i++) {
    const cell = document.createElement("button");
    cell.className = "cell" + (state[i] ? " popped" : "");
    cell.dataset.idx = i;
    const pw = powerUps[i];
    cell.innerHTML = makeBubbleSVG(i, pw === "gold", pw === "rainbow");
    if (pw && !state[i]) {
      const glow = document.createElement("div");
      glow.className = "power-glow";
      glow.style.setProperty("--glow", pw === "rainbow" ? "#d500f9" : "#ffd54f");
      cell.appendChild(glow);
    }
    if (!state[i]) {
      cell.addEventListener("click", (e) => popBubble(cell, i, e));
    }
    grid.appendChild(cell);
    cells.push(cell);
  }
}

function popBubble(cell, idx, evt) {
  if (state[idx] || finished) return;
  state[idx] = 1;

  comboCount += 1;
  if (comboTimeout) clearTimeout(comboTimeout);
  comboTimeout = setTimeout(() => {
    combo = 1; comboCount = 0; updateComboBadge();
  }, 2000);

  if (comboCount >= 3) {
    const newCombo = Math.min(10, Math.floor(comboCount / 3) + 1);
    if (newCombo > combo) { combo = newCombo; updateComboBadge(true); }
  }

  const pw = powerUps[idx];
  let baseValue = 1;
  if (pw === "gold") baseValue = 5;
  if (pw === "rainbow") baseValue = 10;
  const earned = baseValue * combo;

  streak += 1; sessionPops += 1; totalPops += earned;
  if (streak > bestStreak) bestStreak = streak;

  try {
    if (pw) {
      const s = document.getElementById("powerSound");
      s.currentTime = 0; s.play().catch(()=>{});
    } else {
      const p = document.getElementById("popSound");
      p.currentTime = 0; p.play().catch(()=>{});
    }
    if (streak % 10 === 0) {
      const st = document.getElementById("streakSound");
      st.currentTime = 0; st.play().catch(()=>{});
    }
  } catch(e) {}

  document.getElementById("streak-icon").classList.toggle("streak-fire", streak % 10 === 0);

  cell.classList.add("popping");

  const rect = cell.getBoundingClientRect();
  const floater = document.createElement("div");
  floater.className = "float-score";
  floater.textContent = `+${earned}`;
  if (combo > 1) floater.textContent += ` ×${combo}`;
  floater.style.left = (rect.left + rect.width / 2 - 24) + "px";
  floater.style.top = (rect.top - 4) + "px";
  if (pw === "rainbow") floater.style.color = "#d500f9";
  if (pw === "gold") floater.style.color = "#ffd54f";
  document.body.appendChild(floater);
  setTimeout(() => floater.remove(), 950);

  spawnSparkles(rect, pw);

  if (pw) {
    document.body.animate(
      [{transform: "translate(0,0)"}, {transform: "translate(5px,-5px)"},
       {transform: "translate(-5px,5px)"}, {transform: "translate(0,0)"}],
      {duration: 280, easing: "ease-out"}
    );
  }

  setTimeout(() => {
    cell.classList.remove("popping");
    cell.classList.add("popped");
    if (powerUps[idx]) {
      const g = cell.querySelector(".power-glow");
      if (g) g.remove();
    }
  }, 330);

  updateHUD();
  sendUpdate();

  if (state.every(v => v === 1)) setTimeout(finishSheet, 400);
}

function spawnSparkles(rect, pw) {
  const n = pw === "rainbow" ? 14 : pw === "gold" ? 10 : 5;
  const colors = ["#ffea00", "#ff1744", "#00e676", "#00b0ff", "#d500f9", "#fff"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = "✦";
    s.style.left = (rect.left + rect.width / 2) + "px";
    s.style.top = (rect.top + rect.height / 2) + "px";
    const angle = (i / n) * Math.PI * 2 + Math.random() * 0.3;
    const dist = 50 + Math.random() * 30;
    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    s.style.color = colors[i % colors.length];
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }
}

function updateComboBadge(pulse) {
  const badge = document.getElementById("comboBadge");
  badge.textContent = `×${combo}`;
  if (combo > 1) {
    badge.classList.add("active");
    if (pulse) {
      badge.classList.remove("pulse");
      void badge.offsetWidth;
      badge.classList.add("pulse");
    }
  } else {
    badge.classList.remove("active");
  }
}

function updateHUD() {
  document.getElementById("streak").textContent = streak;
  document.getElementById("total").textContent = totalPops;
  document.getElementById("best").textContent = bestStreak;
}

function finishSheet() {
  finished = true;
  try {
    const f = document.getElementById("finishSound");
    f.currentTime = 0; f.play().catch(()=>{});
  } catch(e) {}
  const cont = document.getElementById("finish-container");
  cont.innerHTML = `
    <div class="finish-banner">
      🎉 ALL POPPED! +20 🪙<br>
      <span style="font-size:15px;font-weight:500;">
        Best streak: ${bestStreak} · Total: ${totalPops}
      </span>
    </div>
    <button class="btn" onclick="resetSheet()">🫧 NEW SHEET</button>
  `;
  sendUpdate();
}

function resetSheet() {
  state = new Array(state.length).fill(0);
  streak = 0; sessionPops = 0; finished = false;
  combo = 1; comboCount = 0;
  updateComboBadge();
  document.getElementById("finish-container").innerHTML = "";
  renderGrid();
  updateHUD();
  sendUpdate();
}

function sendUpdate() {
  if (window.Streamlit && window.Streamlit.setComponentValue) {
    window.Streamlit.setComponentValue({
      total_pops: totalPops,
      best_streak: bestStreak,
      streak: streak,
      session_pops: sessionPops,
      state: state,
      finished: finished,
      combo: combo,
    });
  }
}

try {
  if (window.Streamlit) {
    window.Streamlit.events.addEventListener(window.Streamlit.RENDER_EVENT, onRender);
    window.Streamlit.setComponentReady();
    window.Streamlit.setFrameHeight(720);
  }
} catch(e) {
  onRender({data: {args: {rows: 10, cols: 10, state: new Array(100).fill(0)}}});
}

document.documentElement.style.setProperty("--cols", 10);
document.body.style.setProperty("--bg", THEMES.ocean.bg);

function idleDrift() {
  cells.forEach((cell, i) => {
    if (state[i]) return;
    const svg = cell.querySelector(".bubble-svg");
    if (!svg) return;
    const t = performance.now() / 1000;
    const dx = Math.sin(t * 1.2 + i * 0.7) * 1.2;
    const dy = Math.cos(t * 1.5 + i * 1.1) * 1.2;
    svg.style.transform = `translate(${dx}px, ${dy}px)`;
  });
  requestAnimationFrame(idleDrift);
}
requestAnimationFrame(idleDrift);
</script>
</body>
</html>
